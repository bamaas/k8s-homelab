---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-system
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/bamaas/k8s-homelab.git
        revision: test
        directories:
          - path: 'argocd/*'
          - path: 'argocd/bootstrap'
            exclude: true
  template:
    metadata:
      name: 'argocd-{{ .path.basename }}'
    spec:
      project: argocd-system
      sources:
        - repoURL: https://github.com/bamaas/k8s-homelab.git
          targetRevision: test
          path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
