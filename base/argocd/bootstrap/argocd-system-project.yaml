---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd-system
  namespace: argocd
spec:
  description: ArgoCD system management - ApplicationSets, Projects, and system configuration
  sourceRepos:
    - 'https://github.com/bamaas/k8s-homelab.git'
  destinations:
    - namespace: argocd
      server: '*'
  clusterResourceWhitelist:
    - group: 'argoproj.io'
      kind: '*'
  namespaceResourceWhitelist:
    - group: 'argoproj.io'
      kind: '*'
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
