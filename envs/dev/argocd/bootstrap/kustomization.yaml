---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/argocd/bootstrap/

patches:
  - target:
      kind: ApplicationSet
      name: bootstrap-system
    patch: |-
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: envs/dev/argocd/*
      - op: replace
        path: /spec/generators/0/git/directories/1/path
        value: envs/dev/argocd/bootstrap
